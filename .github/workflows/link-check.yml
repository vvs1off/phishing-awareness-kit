name: Link check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path LICENSE --exclude '^https://example\.(com|net|org)' '**/*.md'
          fail: true
